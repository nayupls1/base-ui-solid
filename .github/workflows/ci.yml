name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      # What a release would upload, without uploading it. The checkout's version (0.0.0) is below
      # the published one, and npm refuses to apply `latest` to it, so the dry run names a tag.
      - run: npm publish --dry-run --tag ci packages/utils/dist && npm publish --dry-run --tag ci packages/solid/dist
